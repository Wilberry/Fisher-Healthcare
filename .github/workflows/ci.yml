name: Fisher Healthcare Foundation CI
on:
  # Intentionally manual-only while GitHub Actions is blocked by billing.
  # Phase 1 acceptance runs locally via scripts/verify-phase1-local.sh.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  phase1-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://fisher:fisher_ci_only@localhost:5432/fisher_test
      NEXT_TELEMETRY_DISABLED: '1'
      FISHER_DISPOSABLE_DB_ACK: disposable-test-only
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fisher_test
          POSTGRES_USER: fisher
          POSTGRES_PASSWORD: fisher_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fisher -d fisher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify database migrations, integrity, and rollback
        run: bash scripts/verify-database.sh
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Production builds
        run: pnpm build
      - name: Generate API contracts
        run: pnpm --filter @fisher/api openapi:generate
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high
      - name: Publish generated verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fisher-phase1-verification
          if-no-files-found: warn
          path: |
            pnpm-lock.yaml
            docs/api/openapi.json
