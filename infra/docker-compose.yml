services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fisher_dev
      POSTGRES_USER: fisher
      POSTGRES_PASSWORD: fisher_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisher -d fisher_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - fisher_pgdata:/var/lib/postgresql/data
volumes:
  fisher_pgdata:
